name: Update TABS database

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabs-database-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions repository secret DATABASE_URL. Add it in Settings > Secrets and variables > Actions before running the daily sync."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test scraper safeguards
        run: python -m unittest discover -s tests -p 'test_tabs_sync.py' -v
      - name: Update Neon from public TABS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u scripts/sync_tabs.py --refresh-limit 500
      - name: Geocode new and changed project addresses
        if: success()
        continue-on-error: true
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u scripts/geocode_projects.py --limit 3000 --chunk 500
